services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: rate-limiter-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Any rate-limiter.* property can be overridden here, e.g.:
      # RATE_LIMITER_CAPACITY: 10
      # RATE_LIMITER_REFILL_RATE_PER_SECOND: 5
      # RATE_LIMITER_FAIL_OPEN_ON_REDIS_ERROR: "true"
    ports:
      - "8080:8080"
