server:
  port: 8080

spring:
  application:
    name: rate-limiter
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Latency budget for each rate-limit decision. Without it Lettuce waits up to 60s
      # before the fail-open / fail-closed policy can kick in.
      timeout: 250ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

rate-limiter:
  # Burst size: a new client can make this many requests back to back.
  capacity: 2
  # Sustained rate. requests-per-minute / 60, so 0.0333 is about 2 requests per minute.
  refill-rate-per-second: 0.0333
  # Tokens consumed per request.
  cost-per-request: 1
  # Redis failure policy: true = let traffic through (fail-open), false = respond 503 (fail-closed).
  fail-open-on-redis-error: false
  # Never rate limited (health checks, metrics scraping).
  excluded-paths:
    - /actuator/**
